<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <h1 class="popup-title">Quick Notes</h1>
    </header>

    <section class="add-section">
      <form id="note-form" class="note-form">
        <div class="input-wrap">
          <input type="text" id="note-input" placeholder="Add a note..." required autocomplete="off" />
          <button type="button" id="clear-note-btn" class="icon-btn icon-btn-clear" title="Clear" aria-label="Clear" hidden>×</button>
        </div>
        <div class="form-actions">
          <button type="button" id="mic-btn" class="icon-btn icon-btn-mic" title="Speak your note" aria-label="Speak your note">🎤</button>
          <button type="submit" class="btn-add"><span class="btn-add-icon" aria-hidden="true">+</span> Add</button>
        </div>
      </form>
      <div id="mic-status" class="mic-badge" role="status" aria-live="polite"></div>
    </section>

    <section class="notes-section">
      <ul id="notes-list" class="notes-list"></ul>
    </section>

    <footer class="popup-footer">
      <label for="keep-done" class="retention-label">Keep completed</label>
      <select id="keep-done" title="How long to keep checked items">
        <option value="forever">Forever</option>
        <option value="1d">1 day</option>
        <option value="3d">3 days</option>
        <option value="1w">1 week</option>
        <option value="2w">2 weeks</option>
        <option value="1m">1 month</option>
      </select>
    </footer>
  </div>
  <div id="edit-overlay" class="edit-overlay" hidden aria-hidden="true">
    <div class="edit-overlay-backdrop"></div>
    <div class="edit-overlay-window">
      <h2 class="edit-overlay-title">Edit note</h2>
      <textarea id="edit-note-input" class="edit-note-input" rows="4" placeholder="Note text..."></textarea>
      <div class="edit-overlay-actions">
        <button type="button" id="edit-cancel-btn" class="btn-edit-cancel">Cancel</button>
        <button type="button" id="edit-save-btn" class="btn-edit-save">Save</button>
      </div>
    </div>
  </div>
  <audio id="success-sound" src="success.wav" preload="auto"></audio>
  <script src="popup.js"></script>
</body>
</html>
